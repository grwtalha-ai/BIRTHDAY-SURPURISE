<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .window {
            background: #fff0f5;
            width: 320px;
            border: 3px solid #d81b60;
            border-radius: 8px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            overflow: hidden;
        }
        .title-bar {
            background: #d81b60;
            color: white;
            padding: 5px 10px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .content {
            padding: 20px;
        }
        .btn {
            background-color: #d81b60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #ad1457;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <span>SURPRISE.EXE</span>
            <span>❤️</span>
        </div>
        <div class="content">
            <div id="step1">
                <h3>🎉 Happy Birthday! 🎉</h3>
                <p>A special surprise is waiting for you...</p>
                <button class="btn" onclick="nextStep(2)">START SURPRISE</button>
            </div>

            <div id="step2" class="hidden">
                <h3>🎂 Make a Wish! 🎂</h3>
                <p>Wishing you a day filled with happiness, great laughs, and all your favorite things!</p>
                <button class="btn" onclick="nextStep(3)">OPEN MESSAGE 💌</button>
            </div>

            <div id="step3" class="hidden">
                <h3>💖 My Best Friend</h3>
                <p>Thank you for being such an awesome part of my life. Stay happy always! Have a blast today! 🥳</p>
            </div>
        </div>
    </div>

    <script>
        function nextStep(step) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.add('hidden');
            
            document.getElementById('step' + step).classList.remove('hidden');
        }
    </script>
</body>
</html>
